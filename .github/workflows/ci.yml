name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 与 Node 测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 测试依赖
        run: python -m pip install -e '.[test]'

      - name: 运行 Python 测试
        run: pytest

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: 运行 Node 策略测试
        run: node --test tests-node/*.test.mjs
